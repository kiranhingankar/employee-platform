name: Employee Platform CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python 
        run: python -m py_compile app/src/app.py

      - name: Scan repository for secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: table
          exit-code: "1"

      - name: Build Docker image
        run: |
          docker build \
          -t employee-platform:${{ github.sha }} \
          ./app

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: employee-platform:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Verify Docker image
        run: docker image inspect employee-platform:${{ github.sha }}

      - name: Run Container
        run: | 
          docker run -d \
          --name employee-platform-ci \
          -p 8080:8080 \
          employee-platform:${{ github.sha }}

      - name: Wait for application
        run: |
          for attempt in $(seq 1 15); do
            if curl --fail --silent http://localhost:8080/health; then
              exit 0
            fi
            sleep 2
          done
          echo "Application health check failed"
          docker logs employee-platform-ci
          exit 1

      - name: Test metrics endpoint
        run: |
          curl --fail --silent http://localhost:8080/metrics \
          | grep -q "employee_platform_requests_total"

      - name: Scan Kubernetes manifests
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: kubernetes/
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
      - name: Cleanup
        if: always()
        run: docker rm -f employee-platform-ci || true
