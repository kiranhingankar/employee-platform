apiVersion: apps/v1
kind: Deployment

metadata:
  name: employee-platform
  namespace: employee-platform
  labels:
    app: employee-platform

spec:
  replicas: 3

  selector:
    matchLabels:
      app: employee-platform

  template:
    metadata:
      labels:
        app: employee-platform

    spec:
      containers:
        - name: employee-platform
          image: employee-platform:v3

          ports:
            - containerPort: 8080

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5