apiVersion: apps/v1
kind: Deployment

metadata:
  name: employee-platform
  namespace: employee-platform
  labels:
    app: employee-platform

spec:
  replicas: 3

  selector:
    matchLabels:
      app: employee-platform

  template:
    metadata:
      labels:
        app: employee-platform

    spec:
      securityContext: 
        runAsNonRoot: true 
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: 
          type: RuntimeDefault

      containers:
        - name: employee-platform
          image: employee-platform:v4
          imagePullPolicy: IfNotPresent

          securityContext: 
            allowPrivilegeEscalation: false 
            readOnlyRootFilesystem: true 
            capabilities: 
              drop: 
                - ALL

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3