apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: employee-platform
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - employee-platform
  selector:
    matchLabels:
      app: employee-platform
  endpoints:
    - port: http
      path: /metrics
      interval: 15s