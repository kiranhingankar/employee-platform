apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-proxy-dashboard
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/kiranhingankar/employee-platform.git
    targetRevision: main
    path: monitoring/grafana/gitops
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
